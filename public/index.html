<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kanishka Task Cloud | Engineering Assessment</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(23, 32, 53, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --accent: #38bdf8;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --radius: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

    body {
      background: radial-gradient(circle at top right, #1e1b4b, #0b0f19 70%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 16px;
    }

    .container { width: 100%; max-width: 960px; }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--card-border);
    }
    .brand-title {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #fff 40%, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .brand-subtitle { font-size: 0.8rem; color: var(--text-muted); font-weight: 500; }

    /* Card */
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
    }

    /* Auth Box */
    .auth-container { max-width: 460px; margin: 40px auto 0; }
    .auth-title { font-size: 1.3rem; font-weight: 700; margin-bottom: 6px; }
    .auth-desc { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 20px; }
    .credential-chips {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }
    .chip {
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: #c7d2fe;
      font-size: 0.75rem;
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .chip:hover { background: rgba(99, 102, 241, 0.3); color: #fff; }

    /* Inputs & Buttons */
    label { font-size: 0.8rem; font-weight: 600; color: var(--text-muted); display: block; margin-bottom: 6px; }
    input, textarea, select {
      width: 100%;
      background: rgba(11, 15, 25, 0.8);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      color: #fff;
      padding: 12px 14px;
      margin-bottom: 16px;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, textarea:focus, select:focus { border-color: var(--primary); }
    button {
      background: linear-gradient(135deg, var(--primary), var(--primary-hover));
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 12px 20px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.15s, opacity 0.2s;
    }
    button:hover { opacity: 0.95; transform: translateY(-1px); }
    button:active { transform: translateY(0); }
    .btn-secondary { background: rgba(255, 255, 255, 0.08); color: var(--text-main); }
    .btn-secondary:hover { background: rgba(255, 255, 255, 0.14); }

    /* Stats Grid */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      padding: 16px 20px;
      border-radius: 12px;
    }
    .stat-num { font-size: 1.7rem; font-weight: 700; color: #fff; margin-top: 4px; }

    /* Task Item */
    .task-item {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      transition: border-color 0.2s;
    }
    .task-item:hover { border-color: rgba(99, 102, 241, 0.4); }
    .task-title { font-size: 1rem; font-weight: 600; color: #fff; margin-bottom: 4px; }
    .task-desc { font-size: 0.85rem; color: var(--text-muted); line-height: 1.4; }
    
    /* Status Badges */
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .badge-pending { background: rgba(245, 158, 11, 0.15); color: var(--warning); border: 1px solid rgba(245, 158, 11, 0.3); }
    .badge-in-progress { background: rgba(56, 189, 248, 0.15); color: var(--accent); border: 1px solid rgba(56, 189, 248, 0.3); }
    .badge-testing { background: rgba(168, 85, 247, 0.15); color: #c084fc; border: 1px solid rgba(168, 85, 247, 0.3); }
    .badge-completed { background: rgba(16, 185, 129, 0.15); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.3); }

    .role-badge {
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 600;
      text-transform: uppercase;
      background: rgba(255, 255, 255, 0.1);
      color: #e2e8f0;
    }
    .role-admin { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.3); }

    /* Toast */
    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.3s;
      z-index: 1000;
    }
    #toast.show { opacity: 1; transform: translateY(0); }
    #toast.success { background: var(--success); color: #fff; }
    #toast.error { background: var(--danger); color: #fff; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <div class="brand-title">Kanishka Task Cloud</div>
        <div class="brand-subtitle">Automated REST Engine & Task Orchestration</div>
      </div>
      <div id="userHeaderInfo" style="display: none; align-items: center; gap: 12px;">
        <span id="headerUserEmail" style="font-size: 0.85rem; color: var(--text-muted);"></span>
        <span id="headerUserRole" class="role-badge"></span>
        <button class="btn-secondary" style="padding: 8px 14px; font-size: 0.8rem;" onclick="logout()">Sign Out</button>
      </div>
    </header>

    <!-- Login View -->
    <div id="authSection" class="auth-container">
      <div class="card">
        <h2 class="auth-title">Welcome Back</h2>
        <p class="auth-desc">Authenticate to interact with protected Task APIs</p>

        <label>Quick Fill Seed Credentials</label>
        <div class="credential-chips">
          <span class="chip" onclick="fillCreds('admin@example.com', 'AdminPass123!')">⚡ Admin Account</span>
          <span class="chip" onclick="fillCreds('user@example.com', 'UserPass123!')">⚡ User Account</span>
        </div>

        <label>Work Email</label>
        <input type="email" id="emailInput" placeholder="name@domain.com" />

        <label>Password</label>
        <input type="password" id="passwordInput" placeholder="••••••••" />

        <button style="width: 100%;" onclick="login()">Authenticate Session</button>
      </div>
    </div>

    <!-- Main Dashboard View -->
    <div id="dashboardSection" style="display: none;">
      <!-- Stats Row -->
      <div class="stats-row">
        <div class="stat-card">
          <label>TOTAL TASKS</label>
          <div class="stat-num" id="statTotal">0</div>
        </div>
        <div class="stat-card">
          <label>IN PROGRESS</label>
          <div class="stat-num" style="color: var(--accent);" id="statProgress">0</div>
        </div>
        <div class="stat-card">
          <label>COMPLETED</label>
          <div class="stat-num" style="color: var(--success);" id="statCompleted">0</div>
        </div>
      </div>

      <!-- New Task Card -->
      <div class="card">
        <h3 style="font-size: 1.1rem; margin-bottom: 16px;">Create New Task</h3>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
          <div>
            <label>Task Title</label>
            <input type="text" id="newTitle" placeholder="e.g. Audit JWT signature claims" />
          </div>
          <div>
            <label>Description (Optional)</label>
            <input type="text" id="newDesc" placeholder="e.g. Test expiry with invalid token" />
          </div>
        </div>
        <button onclick="createTask()">+ Publish Task</button>
      </div>

      <!-- Tasks List Card -->
      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
          <h3 style="font-size: 1.1rem;">Assigned Tasks Feed</h3>
          <button class="btn-secondary" style="padding: 6px 14px; font-size: 0.8rem;" onclick="loadTasks()">↻ Refresh</button>
        </div>
        <div id="taskList">Loading tasks...</div>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    let token = localStorage.getItem('token') || '';
    let currentUser = null;

    if (token) checkSession();

    function fillCreds(email, pass) {
      document.getElementById('emailInput').value = email;
      document.getElementById('passwordInput').value = pass;
    }

    function showToast(text, type = 'success') {
      const toast = document.getElementById('toast');
      toast.textContent = text;
      toast.className = `show ${type}`;
      setTimeout(() => { toast.className = ''; }, 3000);
    }

    async function login() {
      const email = document.getElementById('emailInput').value.trim();
      const password = document.getElementById('passwordInput').value.trim();
      if (!email || !password) return showToast('Please enter both email and password', 'error');

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (data.success) {
          token = data.data.token;
          localStorage.setItem('token', token);
          showToast('Login successful!');
          checkSession();
        } else {
          showToast(data.message || 'Authentication failed', 'error');
        }
      } catch {
        showToast('Server connection failed', 'error');
      }
    }

    async function checkSession() {
      try {
        const res = await fetch('/api/auth/me', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        if (data.success) {
          currentUser = data.data;
          document.getElementById('authSection').style.display = 'none';
          document.getElementById('dashboardSection').style.display = 'block';
          document.getElementById('userHeaderInfo').style.display = 'flex';
          document.getElementById('headerUserEmail').textContent = currentUser.email;
          
          const roleEl = document.getElementById('headerUserRole');
          roleEl.textContent = currentUser.role;
          roleEl.className = `role-badge ${currentUser.role === 'admin' ? 'role-admin' : ''}`;
          
          loadTasks();
        } else {
          logout();
        }
      } catch {
        logout();
      }
    }

    function logout() {
      token = '';
      currentUser = null;
      localStorage.removeItem('token');
      document.getElementById('authSection').style.display = 'block';
      document.getElementById('dashboardSection').style.display = 'none';
      document.getElementById('userHeaderInfo').style.display = 'none';
      showToast('Signed out successfully');
    }

    async function loadTasks() {
      const list = document.getElementById('taskList');
      try {
        const res = await fetch('/api/tasks', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        if (data.success) {
          const tasks = data.data;
          
          // Compute stats
          document.getElementById('statTotal').textContent = tasks.length;
          document.getElementById('statProgress').textContent = tasks.filter(t => t.status === 'In Progress').length;
          document.getElementById('statCompleted').textContent = tasks.filter(t => t.status === 'Completed').length;

          if (tasks.length === 0) {
            list.innerHTML = '<p style="color: var(--text-muted); text-align: center; padding: 20px;">No tasks assigned yet.</p>';
            return;
          }

          list.innerHTML = tasks.map(t => {
            const badgeClass = t.status.toLowerCase().replace(' ', '-');
            const isAdmin = currentUser && currentUser.role === 'admin';
            
            return `
              <div class="task-item">
                <div style="flex: 1;">
                  <div class="task-title">${escapeHtml(t.title)}</div>
                  <div class="task-desc">${escapeHtml(t.description || 'No description provided.')}</div>
                  <div style="margin-top: 8px; display: flex; align-items: center; gap: 10px;">
                    <span class="badge badge-${badgeClass}">${t.status}</span>
                    <small style="color: var(--text-muted); font-size: 0.75rem;">Owner: ${t.creator_name || 'Assigned'}</small>
                  </div>
                </div>
                ${isAdmin ? `
                  <div style="min-width: 140px;">
                    <label style="font-size: 0.7rem;">ADMIN STATUS</label>
                    <select style="margin: 0; padding: 6px 10px; font-size: 0.8rem;" onchange="updateStatus(${t.id}, this.value)">
                      <option value="Pending" ${t.status === 'Pending' ? 'selected' : ''}>Pending</option>
                      <option value="In Progress" ${t.status === 'In Progress' ? 'selected' : ''}>In Progress</option>
                      <option value="Testing" ${t.status === 'Testing' ? 'selected' : ''}>Testing</option>
                      <option value="Completed" ${t.status === 'Completed' ? 'selected' : ''}>Completed</option>
                    </select>
                  </div>
                ` : ''}
              </div>
            `;
          }).join('');
        }
      } catch {
        list.innerHTML = '<p style="color: var(--danger);">Failed to fetch tasks.</p>';
      }
    }

    async function createTask() {
      const title = document.getElementById('newTitle').value.trim();
      const description = document.getElementById('newDesc').value.trim();
      if (!title) return showToast('Task title is required', 'error');

      try {
        const res = await fetch('/api/tasks', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ title, description })
        });
        const data = await res.json();
        if (data.success) {
          showToast('Task created successfully');
          document.getElementById('newTitle').value = '';
          document.getElementById('newDesc').value = '';
          loadTasks();
        } else {
          showToast(data.message || 'Creation rejected', 'error');
        }
      } catch {
        showToast('Network error while creating task', 'error');
      }
    }

    async function updateStatus(taskId, status) {
      try {
        const res = await fetch(`/api/tasks/${taskId}/status`, {
          method: 'PATCH',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ status })
        });
        const data = await res.json();
        if (data.success) {
          showToast(`Task status updated to ${status}`);
          loadTasks();
        } else {
          showToast(data.message || 'Update failed', 'error');
        }
      } catch {
        showToast('Error modifying status', 'error');
      }
    }

    function escapeHtml(str) {
      return str.replace(/[&<>'"]/g, tag => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[tag] || tag));
    }
  </script>
</body>
</html>
